name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          # CI never has keys and never calls a model: judges are mocked.
          GEMINI_API_KEY: ""
          CEREBRAS_API_KEY: ""
          GROQ_API_KEY: ""
