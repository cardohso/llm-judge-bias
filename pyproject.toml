[project]
name = "llm-judge-bias"
version = "0.1.0"
description = "A pre-registered experiment on LLM-judge miss rates and self-preference, on EU railway law."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "goldpass @ git+https://github.com/cardohso/goldpass.git@v0.2.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgebias"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the generation prompt is quoted verbatim from the rail repo; wrapping it would change it
"generation/prompts.py" = ["E501"]
# hand-written edits quote answer sentences verbatim
"perturbations/handwritten_source.py" = ["E501"]
